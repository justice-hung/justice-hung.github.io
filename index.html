<head>

<style>
  :root {
    --bg: #0E1116;
    --surface: #131820;
    --surface-hover: #171C24;
    --line: #252B35;
    --card-line: #2A313C;
    --text: #E8E6E1;
    --text-strong: #F5F3EE;
    --text-soft: #C4C8CF;
    --muted: #A9AFB9;
    --dim: #8B93A1;
    --faint: #6F7785;
    --accent: #F2A541;
    --accent-bg: #1A1610;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: calc(72px + env(safe-area-inset-top, 0px)) 20px calc(56px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 40px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em;
    color: var(--dim); border-bottom: 1px solid var(--line); padding-bottom: 14px;
  }
  .topbar .status { color: var(--accent); }

  .hero { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    border: 2px solid var(--accent); background: var(--surface-hover);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
    font-family: var(--mono); font-size: 34px; font-weight: 600; color: var(--accent);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  h1 { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: var(--text-strong); }
  .handle { font-family: var(--mono); font-size: 14px; color: var(--dim); margin-top: 6px; }
  .bio { margin: 0; font-size: 16px; line-height: 1.75; color: var(--text-soft); max-width: 440px; }

  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    min-height: 76px; padding: 16px 20px;
    border: 1px solid var(--card-line); border-radius: 14px;
    background: var(--surface); color: var(--text-strong); text-decoration: none;
    transition: border-color .15s, background-color .15s;
  }
  .card:hover { border-color: var(--accent); background: var(--surface-hover); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card.featured { border-color: var(--accent); background: var(--accent-bg); }
  .card svg { flex: none; width: 28px; height: 28px; stroke: var(--text); }
  .card.featured svg { stroke: var(--accent); }
  .card .label { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .card .name { font-size: 17px; font-weight: 700; }
  .card .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .card .arrow { font-family: var(--mono); font-size: 18px; color: var(--dim); }
  .card.featured .arrow { color: var(--accent); }

  footer { text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--faint); }

  @media (max-width: 420px) {
    body { padding-top: calc(48px + env(safe-area-inset-top, 0px)); }
    h1 { font-size: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="topbar" aria-hidden="true">
    <span>PROFILE / 個人檔案</span>
    <span class="status">● ONLINE</span>
  </div>

  <header class="hero">
    <!-- 大頭照：把圖片命名為 avatar.jpg 上傳到 repo 根目錄即可自動顯示；沒有圖片時會顯示 JH -->
    <div class="avatar">JH<img src="avatar.jpg" alt="Justice Hung" onerror="this.remove()"></div>
    <div>
      <h1>Justice Hung</h1>

    </div>
    <p class="bio">台股盤後研究、自己寫看盤工具，也在 YouTube 分享市場觀察。歡迎追蹤，一起把盤看清楚。</p>
  </header>

  <ul class="links">
    <li>

        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
        <span class="label"><span class="name">YouTube</span><span class="sub">@justice_hung</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </li>
    <li>
      <a class="card" href="https://www.instagram.com/justice_hung" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6"/></svg>
        <span class="label"><span class="name">Instagram</span><span class="sub">@justice_hung</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </li>
    <li>
      <a class="card" href="https://www.threads.com/@justice_hung66" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.9 7.9"/></svg>
        <span class="label"><span class="name">Threads</span><span class="sub">@justice_hung66</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </li>
  </ul>

  <footer>© <span id="y">2026</span> JUSTICE HUNG</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
